[package]
name = "tk-core"
description = "tk's domain rules: no I/O, no clock, no std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Every dependency without std.
[dependencies]
bon = { workspace = true, features = ["alloc"] }
jiff = { workspace = true, features = ["alloc", "serde"] }
nutype = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["alloc", "derive"] }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
# JSON Schema for tk-app's `tk schema`. Off by default so the bare-metal check stays std-free.
schema = ["dep:schemars", "schemars/derive", "schemars/jiff02"]
