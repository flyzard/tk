[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"   # std::fs::File::lock; frizbee needs it too
publish = false

# Crates that tk-core uses are declared without default features: a member can
# only turn features on, never off. Crates that need std add `features = ["std"]`.
[workspace.dependencies]
tk-core = { path = "crates/tk-core" }
tk-store = { path = "crates/tk-store" }
tk-app = { path = "crates/tk-app" }

# tk-core (no_std + alloc)
bon = { version = "3.10", default-features = false }
jiff = { version = "0.2", default-features = false }
nutype = { version = "0.8", default-features = false }
serde = { version = "1", default-features = false }
strum = { version = "0.28", default-features = false }
thiserror = { version = "2", default-features = false }

# tk-store
toml = "1.1"
toml_edit = "0.25"
blake3 = "1.8"
tempfile = "3.27"
camino = "1.2"
fs-err = "3.3"
etcetera = "0.11"
pulldown-cmark = "0.13"

# tk-app
serde_json = "1"
getrandom = "0.4"
schemars = { version = "1.2", default-features = false }
annotate-snippets = "0.12"

# tk (binary)
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
ratatui = "0.30"
crossterm = "0.29"
tui-input = "0.15"
tui-markdown = "0.3"
notify = "8.2"
notify-debouncer-full = "0.7"
frizbee = "0.13"

rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

# dev
proptest = "1.11"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"                  # byte slicing can panic inside "ção"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"              # use #[expect] instead
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
dbg_macro = "deny"
todo = "warn"                          # allowed while sketching signatures; clear before merging
