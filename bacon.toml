# `bacon` runs clippy on every save; warnings (todo!() included) show but don't fail.
# `cargo lint && cargo lint-core` is the gate before merging.
default_job = "clippy"

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.core-nostd]
command = ["cargo", "clippy", "-p", "tk-core", "--target", "thumbv7em-none-eabihf", "--color", "always"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--workspace", "--color", "always"]
need_stdout = true

[keybindings]
n = "job:core-nostd"
